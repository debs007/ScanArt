name: ScanArt

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

packages:
  ScanArtCore:
    path: Packages/ScanArtCore
  ScanArtAlgorithms:
    path: Packages/ScanArtAlgorithms
  ScanArtAR:
    path: Packages/ScanArtAR
  ScanArtRendering:
    path: Packages/ScanArtRendering
  ScanArtExport:
    path: Packages/ScanArtExport
  ScanArtPersistence:
    path: Packages/ScanArtPersistence
  ScanArtUI:
    path: Packages/ScanArtUI

targets:
  ScanArt:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "*.plist"
          - "*.entitlements"
    info:
      path: App/Info.plist
    entitlements:
      path: App/ScanArt.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scanart.app
        PRODUCT_NAME: "Scan Art"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: ScanArtCore
      - package: ScanArtAlgorithms
      - package: ScanArtAR
      - package: ScanArtRendering
      - package: ScanArtExport
      - package: ScanArtPersistence
      - package: ScanArtUI

schemes:
  ScanArt:
    build:
      targets:
        ScanArt: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
